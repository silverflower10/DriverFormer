name: Build & Push DriverFormer

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - run.sh
      - .github/workflows/docker-build.yml

# 공통 환경변수(필요시 여기만 바꾸면 됨)
env:
  IMAGE_REPO: docker.io/silverflower10/driverformer
  IMAGE_TAG: v0.2.4          # ← 새 Docker 이미지 태그
  GIT_REF: v0.2.4            # ← 소스 체크아웃 기준(레포 태그/커밋 SHA 권장)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인(레포 Settings → Secrets에 시크릿 2개 필요)
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        id: bp
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # CUDA 런타임 이미지는 linux/amd64만 타겟(다중 아키텍처 비권장)
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          # Dockerfile의 ARG 값을 여기서 주입
          build-args: |
            GIT_REF=${{ env.GIT_REF }}
          # 캐시(선택) — 첫 빌드면 느릴 수 있음
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed digest
        run: echo "DIGEST=${{ steps.bp.outputs.digest }}"

      # 다이제스트를 아티팩트로 보관(선택)
      - name: Save digest artifact
        run: |
          echo "${{ env.IMAGE_REPO }}@${{ steps.bp.outputs.digest }}" > digest.txt
        shell: bash
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: driverformer-image-digest
          path: digest.txt
