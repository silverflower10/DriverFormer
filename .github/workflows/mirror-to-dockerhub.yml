name: Mirror GHCR to DockerHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to mirror (e.g., latest or v0.1.1-cu121-py312)"
        required: true
        default: "latest"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Set vars
        id: vars
        run: |
          echo "TAG=\${{ github.event.inputs.tag }}" >> \$GITHUB_ENV
          echo "SRC=ghcr.io/silverflower10/driverformer:\${{ github.event.inputs.tag }}" >> \$GITHUB_ENV
          echo "DST=docker.io/\${{ secrets.DOCKERHUB_USERNAME }}/driverformer:\${{ github.event.inputs.tag }}" >> \$GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR (public이면 생략 가능)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}

      - name: Copy image GHCR -> Docker Hub
        uses: skopeo/action-copy@v0.1.6
        with:
          src: docker://\${{ env.SRC }}
          dest: docker://\${{ env.DST }}

      - name: Show result
        run: |
          echo "Mirrored: \$SRC  -->  \$DST"
